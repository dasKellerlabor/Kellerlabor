type: vertical-stack
cards:
  # Überschrift mit aktuellem Spieltag, z. B. "5. Spieltag"
  - type: markdown
    content: >-
      {% set s = states('sensor.bundesliga_spieltagsdaten') %}
      ## {{ s ~ '. Spieltag' if is_number(s) else 'Spieltag' }}

  - type: custom:flex-table-card
    entities:
      include: sensor.bundesliga_spieltagsdaten
    columns:
      # Heim – in Tageszeilen steht hier das Datum (läuft über die ganze Zeile)
      - name: Heim
        data: zeilen
        modify: |-
          x.typ == 'tag'
            ? '<div style="position:relative;height:1.7em;">'
              + '<span style="position:absolute;left:0;top:0.3em;white-space:nowrap;'
              + 'font-weight:600;color:var(--primary-color);">' + x.titel + '</span></div>'
            : x.heim
        align: right
      - name: ''
        data: zeilen
        modify: |-
          x.typ == 'tag' ? '' :
          '<img src="' + x.heim_logo + '" onerror="this.style.visibility=\'hidden\'"'
          + ' style="width:36px;height:36px;object-fit:contain;">'
        align: center
      # Zeit / Ergebnis / Live-Stand
      - name: Zeit/Erg.
        data: zeilen
        modify: |-
          x.typ == 'tag' ? '' :
          x.status == 'live'
            ? '<span style="color:var(--error-color,#db4437);font-weight:700;">' + x.anzeige + '</span>'
              + '<br><span style="color:var(--error-color,#db4437);font-size:10px;font-weight:700;">LIVE</span>'
            : x.status == 'ende'
              ? '<span style="font-weight:700;">' + x.anzeige + '</span>'
              : x.anzeige
        align: center
      - name: ''
        data: zeilen
        modify: |-
          x.typ == 'tag' ? '' :
          '<img src="' + x.gast_logo + '" onerror="this.style.visibility=\'hidden\'"'
          + ' style="width:36px;height:36px;object-fit:contain;">'
        align: center
      - name: Gast
        data: zeilen
        modify: "x.typ == 'tag' ? '' : x.gast"
        align: left
